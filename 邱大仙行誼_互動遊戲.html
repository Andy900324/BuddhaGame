<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運命 —— 邱長春大仙修行模擬</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#14110e; --paper:#ece3d2; --paper2:#d8ccb4;
  --gold:#c9a227; --gold2:#e8c65a; --red:#a83232; --red2:#c94f4f;
  --jade:#5b8c7b; --line:rgba(201,162,39,.28);
}
html,body{height:100%;}
body{
  background:var(--ink);
  background-image:
    radial-gradient(ellipse at 20% 0%, rgba(201,162,39,.07), transparent 60%),
    radial-gradient(ellipse at 80% 100%, rgba(168,50,50,.07), transparent 60%);
  color:var(--paper);
  font-family:"Noto Serif TC","Source Han Serif TC","MingLiU","PMingLiU",serif;
  line-height:1.9; letter-spacing:.03em;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:900px;margin:0 auto;padding:16px 16px 64px;min-height:100vh;}

/* ---------- 通用 ---------- */
.card{
  background:linear-gradient(160deg,rgba(236,227,210,.055),rgba(236,227,210,.02));
  border:1px solid var(--line); border-radius:4px;
  padding:24px 22px; margin-bottom:16px;
  box-shadow:0 2px 24px rgba(0,0,0,.4) inset, 0 4px 18px rgba(0,0,0,.3);
}
.center{text-align:center;}
h1{font-size:clamp(34px,9vw,62px);letter-spacing:.34em;text-indent:.34em;
   color:var(--gold2);font-weight:400;margin-bottom:6px;
   text-shadow:0 0 26px rgba(201,162,39,.35);}
h2{font-size:clamp(19px,4.4vw,25px);color:var(--gold);font-weight:400;
   letter-spacing:.14em;margin-bottom:14px;}
h3{font-size:17px;color:var(--gold);font-weight:400;letter-spacing:.1em;margin-bottom:10px;}
p{margin-bottom:13px;}
.sub{color:var(--paper2);opacity:.8;font-size:14px;letter-spacing:.2em;}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);margin:18px 0;}
.quote{border-left:2px solid var(--red);padding:6px 0 6px 15px;margin:14px 0;
  color:var(--paper2);font-size:15px;line-height:2;}
.em{color:var(--gold2);}
.red{color:var(--red2);}
.small{font-size:13px;opacity:.75;line-height:1.85;}

/* ---------- 按鈕 ---------- */
.btn{display:inline-block;background:transparent;color:var(--gold2);
  border:1px solid var(--gold);border-radius:3px;
  padding:12px 34px;font-size:16px;letter-spacing:.24em;text-indent:.24em;
  font-family:inherit;cursor:pointer;transition:.25s;margin:6px 4px;}
.btn:hover{background:rgba(201,162,39,.14);box-shadow:0 0 18px rgba(201,162,39,.25);}
.btn.ghost{border-color:var(--line);color:var(--paper2);}
.btn.ghost:hover{background:rgba(236,227,210,.06);}
.btn.small-btn{padding:8px 18px;font-size:13px;letter-spacing:.12em;text-indent:.12em;}

/* ---------- 狀態列 ---------- */
#hud{position:sticky;top:0;z-index:20;background:rgba(20,17,14,.94);
  backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  padding:9px 14px;margin:-16px -16px 16px;}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;letter-spacing:.14em;color:var(--paper2);margin-bottom:8px;}
.bars{display:grid;gap:7px;}
.bar-row{display:grid;grid-template-columns:72px 1fr 46px;gap:9px;align-items:center;font-size:12px;}
.bar-name{color:var(--paper2);letter-spacing:.06em;}
.bar-track{height:8px;background:rgba(236,227,210,.09);
  border:1px solid rgba(236,227,210,.14);border-radius:5px;overflow:hidden;}
.bar-fill{display:block;height:100%;width:0;border-radius:4px;
  background:linear-gradient(90deg,rgba(255,255,255,.82),#fff);
  transition:width .8s cubic-bezier(.4,0,.2,1);}
.bar-val{text-align:right;font-size:12px;color:var(--paper2);font-variant-numeric:tabular-nums;}
.f-will{box-shadow:0 0 9px rgba(127,179,196,.75);}
.f-heart{box-shadow:0 0 9px rgba(208,106,106,.75);}
.f-prog{box-shadow:0 0 9px rgba(232,198,90,.8);}
.danger{animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.trait{font-size:11px;border:1px solid var(--line);border-radius:2px;
  padding:3px 9px;color:var(--paper2);letter-spacing:.06em;}
.trait b{color:var(--gold2);font-weight:400;}
.trait .sep{opacity:.4;margin:0 5px;}
.trait.done{border-color:var(--jade);color:#8fc9b3;}
.trait.done b{color:#8fc9b3;}
.trait.demon{border-color:var(--red);color:var(--red2);}

/* ---------- 插圖 ---------- */
.art{display:block;width:100%;height:auto;margin:4px 0 18px;
  border:1px solid var(--line);border-radius:3px;
  background:radial-gradient(ellipse at 50% 120%, rgba(201,162,39,.10), rgba(0,0,0,.32) 70%);}
.art .ink{fill:none;stroke:#ece3d2;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.art .gold{fill:none;stroke:#c9a227;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.art .far{fill:none;stroke:#c9a227;stroke-width:1.4;opacity:.42;stroke-linecap:round;}
.art .red{fill:none;stroke:#a83232;stroke-width:2.2;stroke-linecap:round;}
.art .fillp{fill:#ece3d2;stroke:none;}
.art .fillg{fill:#c9a227;stroke:none;}
.art .fillr{fill:#a83232;stroke:none;}
.art .dim{opacity:.55;}
.art .glow{filter:drop-shadow(0 0 6px rgba(201,162,39,.75));}

/* ---------- 事件 ---------- */
.ch-label{font-size:12px;letter-spacing:.4em;color:var(--gold);opacity:.85;margin-bottom:6px;}
.scene{font-size:16px;line-height:2.15;color:var(--paper);}
.scene .hl{color:var(--gold2);}
.ask{margin:20px 0 4px;color:var(--gold2);font-size:17px;letter-spacing:.08em;}
.opts{display:grid;gap:10px;margin-top:12px;}
.opt{text-align:left;background:rgba(236,227,210,.035);
  border:1px solid var(--line);border-radius:3px;
  padding:14px 16px;color:var(--paper);font-family:inherit;font-size:15.5px;
  line-height:1.8;cursor:pointer;transition:.2s;display:flex;gap:12px;align-items:flex-start;}
.opt:hover{background:rgba(201,162,39,.11);border-color:var(--gold);transform:translateX(3px);}
.opt .num{color:var(--gold);flex:0 0 auto;font-size:15px;}

/* ---------- 討論頁 ---------- */
.qbox{border:1px solid var(--line);border-radius:3px;padding:16px 18px;margin:12px 0;
  background:rgba(236,227,210,.03);}
.qnum{color:var(--gold);font-size:13px;letter-spacing:.24em;margin-bottom:6px;}
.qtext{font-size:17px;line-height:2;color:var(--paper);}
.reveal{opacity:0;transition:opacity 1.4s ease;pointer-events:none;}
.reveal.show{opacity:1;pointer-events:auto;}
.tap{border:1px dashed var(--line);border-radius:3px;padding:13px;margin-top:16px;
  text-align:center;color:var(--gold);font-size:14px;letter-spacing:.16em;
  cursor:pointer;transition:.25s;user-select:none;}
.tap:hover{background:rgba(201,162,39,.1);border-color:var(--gold);}
.ans{border-left:2px solid var(--gold);background:rgba(201,162,39,.07);
  padding:14px 18px;margin:14px 0;font-size:16.5px;line-height:2.1;color:var(--gold2);}

/* ---------- 結果 ---------- */
.result{border-color:var(--gold);animation:fade .5s;}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.verdict{font-size:19px;letter-spacing:.16em;margin-bottom:12px;}
.v-ok{color:var(--gold2);} .v-mid{color:#d0a86a;} .v-bad{color:var(--red2);}
.src{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:3px;
  padding:13px 15px;margin:14px 0;font-size:14.5px;line-height:2.05;color:var(--paper2);}
.src .tag{display:block;font-size:11px;letter-spacing:.26em;color:var(--gold);
  margin-bottom:7px;opacity:.9;}
.delta{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
.d{font-size:13px;border-radius:2px;padding:3px 11px;border:1px solid;}
.d.up{color:#8fc9b3;border-color:rgba(91,140,123,.55);background:rgba(91,140,123,.1);}
.d.down{color:var(--red2);border-color:rgba(168,50,50,.5);background:rgba(168,50,50,.1);}
.d.info{color:var(--gold2);border-color:var(--line);background:rgba(201,162,39,.08);}
.d.hunger{color:#d89a63;border-color:rgba(200,120,60,.55);background:rgba(200,120,60,.1);}
.curse{border:1px dashed var(--red);background:rgba(168,50,50,.08);
  padding:12px 14px;margin:13px 0;font-size:14px;color:#e0a0a0;border-radius:3px;}
.good{border:1px dashed var(--jade);background:rgba(91,140,123,.1);color:#8fc9b3;}
.shine{border:1px dashed var(--gold);background:rgba(201,162,39,.1);color:var(--gold2);}

/* ---------- 遺言表 ---------- */
.wills{width:100%;border-collapse:collapse;font-size:15px;margin:12px 0;}
.wills td{padding:11px 8px;border-bottom:1px solid rgba(236,227,210,.12);vertical-align:top;line-height:1.95;}
.wills td:first-child{color:var(--gold2);white-space:nowrap;width:88px;}
.wills tr.me td{background:rgba(201,162,39,.09);}

/* ---------- 結局 ---------- */
.ending-title{font-size:clamp(26px,7vw,44px);color:var(--gold2);letter-spacing:.26em;
  text-indent:.26em;text-align:center;margin:10px 0 18px;
  text-shadow:0 0 30px rgba(201,162,39,.4);}
.ed-step{font-size:12px;letter-spacing:.34em;color:var(--gold);text-align:center;
  margin-bottom:14px;opacity:.85;}
.vow{text-align:center;font-size:17px;line-height:2.4;color:var(--gold2);letter-spacing:.06em;}
.fail-mark{font-size:clamp(30px,8vw,50px);color:var(--red2);letter-spacing:.3em;
  text-indent:.3em;text-align:center;margin:8px 0 14px;}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0;}
.tbl td{padding:7px 6px;border-bottom:1px solid rgba(236,227,210,.1);vertical-align:top;}
.tbl td:first-child{color:var(--gold);white-space:nowrap;width:82px;}
.seven{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;}
.seven span{border:1px solid var(--line);padding:5px 13px;font-size:14px;
  color:var(--paper2);border-radius:2px;}
.seven span.me{border-color:var(--gold);color:var(--gold2);}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:rgba(20,17,14,.96);border:1px solid var(--gold);color:var(--gold2);
  padding:11px 22px;border-radius:3px;font-size:14px;letter-spacing:.1em;
  z-index:99;display:none;box-shadow:0 4px 22px rgba(0,0,0,.6);}
@media(max-width:520px){
  .card{padding:19px 15px;}
  .scene{font-size:15.5px;line-height:2.05;}
  .opt{font-size:15px;padding:12px 13px;}
  .bar-row{grid-template-columns:64px 1fr 42px;}
  .trait{font-size:10.5px;}
  .wills td:first-child{width:70px;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";

/* =======================================================================
   章節
   第一章　學道拜師　事件一～四
   第二章　麻衣論相　事件五、討論、師父遺言、事件六
   第三章　相隨心變　事件七～十（含討論）
   第四章　天仙狀元　特殊事件通過後的結局
   ======================================================================= */
const CH = {
  1:{name:"第一章　學道拜師", start:"ev1"},
  2:{name:"第二章　麻衣論相", start:"ev5"},
  3:{name:"第三章　相隨心變", start:"ev7"},
  4:{name:"第四章　天仙狀元", start:null}
};

/* =======================================================================
   插圖：水墨簡筆，直接寫在檔案裡（離線可用、無外部資源）
   每張 800×180，深墨底＋金線＋宣紙白，對應該事件的場景。
   ======================================================================= */
const SVG_HEAD='<svg class="art" viewBox="0 0 800 180" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">';
const HILLS='<path class="far" d="M0,132 L92,92 L150,120 L232,74 L300,116 L372,88 L440,124 L520,96 L600,130 L680,104 L760,134 L800,118"/>';
const HILLS2='<path class="far" style="opacity:.24" d="M0,110 L70,78 L128,102 L200,60 L268,100 L340,72 L410,108 L500,80 L580,112 L660,86 L740,116 L800,98"/>';
const MOON='<circle class="fillg glow" cx="700" cy="44" r="13" opacity=".8"/>';
const GROUND='<path class="gold" style="opacity:.5" d="M0,150 L800,150"/>';

/* 簡筆人物：立、跪、拜、行 */
function man(x,y,s,pose,cls){
  s=s||1; cls=cls||"ink";
  const g=`<g class="${cls}" transform="translate(${x},${y}) scale(${s})">`;
  if(pose==="kneel")   // 跪拜
    return g+`<circle class="fillp" cx="0" cy="-26" r="6"/><path d="M0,-20 C-4,-10 -8,-2 -14,2"/><path d="M-14,2 L6,2"/><path d="M-2,-14 L-12,-6"/></g>`;
  if(pose==="bow")     // 躬身作揖
    return g+`<circle class="fillp" cx="2" cy="-30" r="6"/><path d="M2,-24 C0,-14 -2,-6 -2,2"/><path d="M-2,2 L-8,16 M-2,2 L6,16"/><path d="M0,-18 L10,-14 L2,-8"/></g>`;
  if(pose==="lie")     // 臥
    return g+`<circle class="fillp" cx="-18" cy="-6" r="6"/><path d="M-12,-4 L14,-2"/><path d="M-4,-4 L2,-12"/></g>`;
  if(pose==="carry")   // 背人
    return g+`<circle class="fillp" cx="0" cy="-30" r="6"/><path d="M0,-24 L-1,-4"/><path d="M-1,-4 L-8,12 M-1,-4 L7,12"/><path d="M-8,-18 L8,-18"/>
      <circle class="fillp" cx="10" cy="-34" r="5"/><path d="M10,-29 C4,-24 0,-22 -6,-20"/></g>`;
  if(pose==="walk")
    return g+`<circle class="fillp" cx="0" cy="-28" r="6"/><path d="M0,-22 L0,-4"/><path d="M0,-4 L-9,12 M0,-4 L8,12"/><path d="M0,-16 L9,-10"/></g>`;
  if(pose==="sit")     // 打坐
    return g+`<circle class="fillp" cx="0" cy="-24" r="6"/><path d="M0,-18 L0,-4"/><path d="M-13,4 C-6,-4 6,-4 13,4"/><path d="M-13,4 L13,4"/></g>`;
  return g+`<circle class="fillp" cx="0" cy="-28" r="6"/><path d="M0,-22 L0,-2"/><path d="M0,-2 L-7,14 M0,-2 L7,14"/><path d="M-9,-14 L9,-14"/></g>`;
}
/* 茅庵 */
function hut(x,y,s){
  return `<g class="ink" transform="translate(${x},${y}) scale(${s||1})">
    <path d="M-34,0 L0,-26 L34,0"/><path d="M-28,0 L-28,26 M28,0 L28,26"/>
    <path d="M-28,26 L28,26"/><path class="gold" d="M-9,26 L-9,6 L9,6 L9,26"/>
    <path d="M-40,2 L40,2"/></g>`;
}
/* 松樹 */
function pine(x,y,s){
  return `<g class="gold" transform="translate(${x},${y}) scale(${s||1})">
    <path d="M0,0 L0,-34"/><path d="M0,-30 L-12,-20 M0,-30 L12,-20"/>
    <path d="M0,-22 L-15,-10 M0,-22 L15,-10"/><path d="M0,-14 L-17,0 M0,-14 L17,0"/></g>`;
}
/* 水波 */
function waves(y,op,amp){
  amp=amp||6; op=op||.6;
  let d="";
  for(let i=0;i<3;i++){
    const yy=y+i*11;
    d+=`<path class="gold" style="opacity:${op-i*.14}" d="M0,${yy} q40,-${amp} 80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0 t80,0"/>`;
  }
  return d;
}

const ART={
/* 事件一　祖師的反應：茅庵前跪拜，祖師擺手不收 */
bow:SVG_HEAD+HILLS2+HILLS+MOON+GROUND+
  hut(190,150,1.15)+pine(90,150,.9)+
  man(330,150,1.1,"kneel")+
  `<g class="gold" transform="translate(430,150)"><circle class="fillg" cx="0" cy="-34" r="7"/>
   <path d="M0,-27 L0,-4"/><path d="M0,-4 L-8,14 M0,-4 L8,14"/>
   <path d="M0,-20 L20,-26"/><path class="red" d="M20,-26 l10,-4 M20,-26 l9,4 M20,-26 l4,9"/></g>
   <text x="470" y="120" fill="#a83232" font-size="15" font-family="serif">不收</text>`+
  waves(0,0,0)+'</svg>',

/* 事件二　祖師不收徒：庵門緊閉，庵外獨立，庵側花枝 */
gate:SVG_HEAD+HILLS2+HILLS+GROUND+
  `<g class="ink" transform="translate(300,150)">
    <path d="M-46,0 L-46,-58 L46,-58 L46,0"/><path d="M-46,-58 L0,-78 L46,-58"/>
    <path class="gold" d="M-14,0 L-14,-40 L14,-40 L14,0"/><path class="gold" d="M0,-40 L0,0"/>
    <circle class="fillg" cx="-6" cy="-22" r="2"/><circle class="fillg" cx="6" cy="-22" r="2"/></g>`+
  pine(120,150,1.1)+
  `<g class="gold" transform="translate(560,150)"><path d="M0,0 C4,-20 -6,-34 2,-52"/>
   <path d="M2,-40 q14,-8 20,-2 M1,-30 q-14,-10 -20,-4"/>
   <circle class="fillr" cx="24" cy="-42" r="3.5"/><circle class="fillr" cx="-20" cy="-36" r="3.5"/>
   <circle class="fillr" cx="4" cy="-54" r="3.5"/></g>`+
  man(650,150,1,"stand")+
  '</svg>',

/* 事件三　門外聽法：門內講法透光，門外側耳 */
listen:SVG_HEAD+HILLS2+GROUND+
  `<g class="ink" transform="translate(300,150)">
    <path d="M-70,0 L-70,-74 L70,-74 L70,0"/>
    <path class="gold glow" d="M-16,0 L-16,-58 L34,-58 L34,0" style="opacity:.9"/>
    <path class="fillg" style="opacity:.13" d="M34,-58 L150,-70 L150,10 L34,0 Z"/></g>`+
  man(250,150,1,"sit")+
  `<g class="gold" style="opacity:.75"><path d="M258,86 q22,-6 40,0 M262,74 q26,-8 48,0"/></g>`+
  man(470,150,1.05,"bow")+
  `<text x="512" y="104" fill="#c9a227" font-size="14" font-family="serif">門外洗耳</text>`+
  pine(690,150,1)+'</svg>',

/* 事件四　賜號長春：眾人環繞、跪者受道號、春枝抽芽 */
name:SVG_HEAD+HILLS2+HILLS+GROUND+
  hut(140,150,1)+
  man(300,150,.9,"stand")+man(345,150,.9,"stand")+man(390,150,.9,"stand")+man(435,150,.9,"stand")+
  man(520,150,1.15,"kneel")+
  `<g transform="translate(620,150)"><g class="gold"><path d="M0,0 C2,-24 -4,-40 2,-60"/>
   <path d="M2,-46 q16,-10 24,-2 M1,-34 q-16,-12 -24,-4"/></g>
   <circle class="fillg glow" cx="26" cy="-48" r="4"/><circle class="fillg glow" cx="-23" cy="-38" r="4"/>
   <circle class="fillg glow" cx="4" cy="-62" r="5"/></g>
   <text x="560" y="52" fill="#e8c65a" font-size="19" font-family="serif" letter-spacing="6">長春</text>`+
  '</svg>',

/* 事件五　師父南遊：山路、四人前行、後方追趕、風雪 */
travel:SVG_HEAD+HILLS2+HILLS+
  `<path class="gold" style="opacity:.5" d="M0,168 C160,142 300,158 460,138 C600,122 700,140 800,126"/>`+
  man(150,150,.95,"walk")+man(196,146,.95,"walk")+man(242,142,.95,"walk")+man(288,138,.95,"walk")+
  man(360,140,.95,"walk")+
  `<g class="ink" transform="translate(560,152)"><circle class="fillp" cx="0" cy="-28" r="6"/>
   <path d="M0,-22 L0,-4"/><path d="M0,-4 L-10,12 M0,-4 L9,12"/><path d="M-2,-16 L-14,-8"/>
   <circle class="gold" cx="-18" cy="-4" r="7"/></g>
   <text x="590" y="140" fill="#c9a227" font-size="14" font-family="serif">追</text>`+
  `<g class="fillp" style="opacity:.45"><circle cx="90" cy="40" r="2"/><circle cx="180" cy="26" r="1.8"/>
   <circle cx="270" cy="52" r="2.2"/><circle cx="380" cy="30" r="1.8"/><circle cx="480" cy="58" r="2"/>
   <circle cx="600" cy="34" r="2.2"/><circle cx="700" cy="60" r="1.8"/><circle cx="140" cy="72" r="1.6"/>
   <circle cx="330" cy="80" r="1.6"/><circle cx="520" cy="24" r="1.6"/></g>`+
  '</svg>',

/* 討論一　祖師為什麼這麼嚴格：戒尺、蒲團、燈 */

ev1:{ch:1,art:"bow",title:"事件一　祖師的反應",
scene:`你叫<span class="hl">邱處機</span>，十九歲，隻身從山東棲霞縣走到寧海縣馬家庄。<br><br>當值的是<span class="hl">馬丹陽</span>，見你如此青年便能誠心學道，覺得罕見，登記姓名後就趕緊帶你去見老師。眾師兄也都圍過來探問。<br><br>你跪在王重陽祖師面前——`,
ask:"猜猜看：王重陽祖師見到你來拜師時，有什麼反應？",
opts:[
 {t:"張開雙手，歡迎他！祖師看他頗有向道之心，開心收他為徒。",kind:"bad",
  res:`沒有阻礙地被收進來，你會覺得修道也不過如此，並不難。<br>日子一久，早課成了應付，打坐成了打盹。意志力與修道心日益下降，最後皆歸零。<br><br><span class="small">這一條最可惜——你從沒失敗過，所以也從沒認真過。</span>`,
  d:{will:-100,heart:-100}},
 {t:"沒特別反應，請他入座！邱處機與一般拜師者無異。",kind:"bad",
  res:`你成了數十名門人裡的其中一個。<br>後來祖師示現重病、遣散眾人時，那些「始勤終怠、有起頭無結尾」的人陸續走光——你也在其中，走得毫無聲息。`,
  d:{heart:-10}},
 {t:"趕走他！祖師一眼識破他的命運，覺得他不適合修道，直接趕走。",kind:"ok",
  res:`你被當場拒絕。<br>可是這一拒，反而把你心裡那點向道之心，點成了火。`,
  src:`重陽先生把他瞧了一瞧，擺一擺頭：「此人心思太多，過於伶俐，學不了道，早些急自回去罷！休得自誤。」<br>又說：「<span class="em">非是我不收他，此人苦根甚重，怕他後來受不過磨難，必生退悔之心，不如不收他為妙。</span>」`,
  d:{will:+10,heart:+10,prog:+4}}
]},

ev3:{ch:1,art:"listen",title:"事件三　門外聽法",
scene:`住了幾天，你跟眾人都混熟了。這日你發現師兄們都不在前廳，想必是在後面聽先生講道。<br><br>你跑到茅庵，不敢進門，就站在門外洗耳靜聽。祖師正講到「修行念頭，細中有細，有一念之私，即有一毫渣滓在心」——講到精微之處，你聽忘了形。`,

  src:`重陽先生向眾子弟說：「<span class="em">門內說法，門外人聽，試問何人，誰是知音？</span>」<br>後又責他：「聞道不進，如理不悟，徒以聰明顯露、伶俐施逞，不能隱忍潛藏，只知使巧弄乖，<span class="em">非道器也</span>！」`,

  res:`祖師當場逐客：「我曾吩咐打發他回去，為何仍在此處？」<br>這次沒有人替你求情，因為你連「門外」的分寸都守不住。`,

ev4:{ch:1,art:"name",title:"事件四　賜號長春",
scene:`祖師怒問馬丹陽：「我曾吩咐你打發他回去，為何仍在此處？」<br><br>話沒說完，劉長生、郝太古、王玉陽、譚長真一齊上前替你求情。你跪在地下不起來。`,

  src:`重陽先生曰：「爾等既再三薦引……你們這般看照他，我即將他收下，<span class="em">與他取個道號名叫長春</span>。」邱啟發即起來三跪九叩。`,

ask:"你怎麼做？",
opts:[

 {t:"追上去。師父不是真的見不得我，他是要我學好。",kind:"ok",
  res:`馬丹陽把自己的衲衣、道帽、蒲團、便鏟、岩瓢全給了你。你穿戴起來，一路追下去。<br><br>這一路你沿途化齋供養師父，他卻嫌「我受不起你這供養」，把岩瓢奪過往地下摔，蒸饝（蒸饅頭）滾落坎下。你一句話沒說，撿起來就追。<br>飯給了師父，自己就常常空著肚子。<br><br>後來雨雪嚴寒，眾人烤火取暖，祖師把柴草全丟進火裡又按滅，濃煙燻得大家逃出山門，還把門閂上，讓你們在廊簷下凍了半夜。天亮進門，祖師要每人責打二十——<span class="em">你跪下說：是弟子一人之錯，我情願替眾師兄受責。</span>`,
  src:`馬丹陽曰：「師傅見不得你，因此才走，你今趕去，必要受氣。」<br>邱長春曰：「<span class="em">師傅豈當真見不得我，不過願我學好，我若不去，豈不辜負師傅一片好心？</span>」<br><br>「因他是幼年學道，不比劉、郝、王、譚是化了氣質的人，<span class="em">若不深加琢磨，焉能使其成器</span>？正所謂磨他種性。誰知長春根基深厚，<span class="em">屢受叱責，並無一點怨恨之心</span>。」`,
  d:{will:+5,heart:+10,prog:+5,small:12,mercy:1}},
 {t:"既然師父嫌我聰明外露，我乾脆下山還俗，證明給他看。",kind:"bad",
  res:`你賭氣走了。氣性一起，道念全消。<br>祖師說「怕他受不過磨難，必生退悔之心」——你只用兩個月就應驗了。`,
  d:{heart:-10}}
]},

ev6:{ch:2,art:"face",title:"事件六　螣蛇鎖口",
scene:`師父安葬之後，你一人東遊西蕩，來到河東地方，見路旁有座整齊莊院，便去化齋。小廝端了一整盤飯食出來，你正要吃——<br><br>一位鬚髮半白的老人走出來，看你一眼，<span class="hl">只從盤裡拿了兩個蒸饝（蒸饅頭）給你</span>，其餘全叫小廝端回去。<br><br>老人自稱「賽麻衣」，精通麻衣相法，斷人窮通壽夭從不差錯。<div class="quote">「適才我觀道長之相，是<span class="em">吃不得飽飯</span>的。若飽吃一頓，便要餓幾頓，不如少給一點，使你頓頓有吃，這是愚老一番好意。」<br><br>「觀你相上鼻端兩條紋路，雙分入口，名為<span class="em">螣蛇鎖口，應主餓死</span>。此厄既不能免，焉能成道？」</div>你問：「可有改乎？」<br>他答：「<span class="hl">相定終身，有何更改？除非一死方休。</span>」並舉趙武靈王（貴為國君，臨死連一個雀蛋都吃不成）、鄧通（御賜銅山鑄錢，最後餓死獄中連一口水都喝不到）為證。`,
ask:"從小父母早亡，想認真唸書老師又不教，現在算命仙又說你注定餓死——你該怎麼辦？",
opts:[
 {t:"人生 Reset，砍掉重練。",kind:"bad",
  res:`你脫下道袍還俗去了。既然修不成，那就別修——<br>這正是祖師當年最怕的那句「<span class="em">受不過磨難，必生退悔之心</span>」。`,
  d:{heart:-15}},
 {t:"絕望，放著給他餓死。學伯夷叔齊，知命順天。",kind:"ok",
  res:`一念入魔，自誤終身。<span class="em">執念著魔，放棄修行，一心尋死。</span><br><br>你揀了一塊大石偃臥其上，<span class="hl">餓了七日七夜，水都不吃一口</span>。<br>你要走過桃子、強盜、鐵鍊三場，才會有人把你打醒。`,
  src:`「賽麻衣這幾輩古人，把邱長春比掉了魂，將這熱念化作了冷灰，一團悟道之心，頓成瓦解冰消……即揀了一塊大石偃臥其上，<span class="em">餓了七日七夜，水都不吃一口</span>，安心餓死。」`,
  d:{will:-20,big:7,small:18,demon:1}},
 {t:"反正都要餓死了，不如及時行樂吧！",kind:"bad",
  res:`你把最後的日子拿去換一時痛快。<br>命是照樣要走的，只是這一趟白走了。`,
  d:{heart:-15}},
 {t:"繼續修道，一定會有所改變的吧？",kind:"bad",
  res:`<span class="red">由於當前的意志力與修道心不足，堅持後造成了反效果。</span><br><br>這句話本身沒有錯——錯在說這句話的時機。<br>此刻你的道心剛被賽麻衣一席話打得「熱念化作冷灰，一團悟道之心，頓成瓦解冰消」，師父又已羽化，無人可問。你嘴上說「一定會改變」，心裡那句「我注定餓死」卻一天問你三遍。<br><br>帶著這個疑心去修，打坐時想的是餓，化齋時想的是餓，越修越證明自己修不成。<span class="em">魔根沒有拔掉，只顧著往前修，一輩子也修不出來。</span><br><br>三年後你放下了蒲團，不是因為看破，是因為累了。`,
  src:`「大凡修行人魔障一來，便要尋著他的根腳，看是從何而起，即於起處輕輕拈去，毫不費力。<span class="em">若魔在這裏著根，你往那裏尋苗，一輩子也尋不出來</span>；就把天下的好話對他說盡，說不著他的心病，他也不能服你。」`,
  d:{heart:-15,will:-20}}
]},

/* ---------------- 第三章　相隨心變 ---------------- */
ev7:{ch:3,art:"peach",title:"事件七　溪邊仙桃",
scene:`你臥在溪邊大石上，餓了七日七夜，滴水不沾。<br><br>第八日不知何處落了驟雨，溪水暴漲，眼看要淹到身邊——你是求死之人，不肯尋別路而死。<br><br>第九日，上流漂來一枚拳頭大的鮮桃，隨波浪在你面前浪來浪去，一股香氣直鑽鼻孔。`,
ask:"你吃不吃？",
opts:[
 {t:"不吃。趙武靈王臨死吃不到雀蛋，鄧通臨死喝不到水，我豈能例外。",kind:"bad",
  res:`你死於執著，不是死於相法。<br><span class="em">相不定人，念定人。</span>`,
  d:{will:-100}},
 {t:"吃。想看看：我這臨死之際，到底吃不吃得到？",kind:"ok",
  res:`這桃子是仙桃，救了你一命。<br>你翻身起來，卻又想：命不該死於水邊，<span class="em">必要絕於高山</span>。<br><br><span class="small">（魔根未除）</span>`,
  src:`「伸手將鮮桃拿來啖之，<span class="em">香美非常</span>，吃畢精神大振，飢渴頓解，溪水亦消。」`,
  d:{will:+10,prog:+4,big:7,small:18}},
 {t:"跳進水裡，直接了斷，省得麻煩。",kind:"bad",
  res:`你連「執一不二」都做不到，只是怕苦。`,
  src:`「若不安命，另起一念，跳入水內，豈不省卻許多困苦？<span class="em">古人之心執一不二，不以生死移其心念，故稱良淳也。</span>」`,
  d:{will:-100}}
]},

ev8:{ch:3,art:"bandit",title:"事件八　秦嶺強盜",
scene:`你走到秦嶺山梁的荒僻小廟，<span class="hl">又餓了八九天</span>，眼睛只剩一線之氣。<br><br>廟外來了十幾個人生火煮肉、開酒分贓——原來是秦嶺攔路打劫的強盜，為首的叫趙璧，還有李雄、張建、王能、朱九。<br><br>酒至半酣，王能說：「咱們弟兄做了一輩子壞事，今天也做做好事好嗎？廟裡那位老師傅不是病，是餓的，我們煮碗麵湯救他一命。」<br><br>他們七手八腳煮好麵湯，把你扶起來抱住腦袋，硬灌了兩碗。`,
ask:"你醒來後怎麼說？",
opts:[
 {t:"埋怨他們多事，並拒收他們要給的銀錢。",kind:"ok",
  res:`<b class="em">關鍵四句話</b><br><br>
  <b>一、你埋怨他們救你</b><br>「真乃求生既不可得，求死亦費許多功夫。」<br>朱九大怒拔刀，你卻拍著肚皮說：「你要殺不須殺別處，可將我肚皮割破，待我理出腸子來，還你無名之食，死也心甘。」——<span class="em">一個不怕死的人，讓他們先愣住了。</span><br><br>
  <b>二、他們要湊銀子給你，你不收</b><br>「凡無功而得人財者，是謂無因；無故而取人錢財、吃人飲食，豈不為妄乎？」<br>並取出隨身木牌：<span class="em">妄接人財筋骨斷，妄吃人食口生瘡。</span><br><br>
  <b>三、朱九反問</b><br>「咱們幫你幾兩銀子你都不敢要，怕帶過帶錯；像我們專以打搶營生，又不知罪惡有多大？」<br><br>
  <b>四、你這句話，把十三個人全嚇醒了</b><br>「列位與我不同。我是前生毫未施濟於人，故今生受不得人家供奉；<span class="hl">列位是前生放得有債賑，那些人騙了你們的錢財，故而今生相見攔路討取，加倍相還。若是不少欠你們的，你們便遇他不著；縱然遇著，也輕輕放他去了。</span>」<br><br>
  <b class="em">為什麼他們會驚愕</b><br>李雄當場算出了下一步：<span class="em">「了不得！依這道長說來，難道人人都少欠我們的？我們未必就不少欠別人的？倘若少欠別人的，再一世別人也要攔路索討，只恐我們還不清白。」</span><br>——他們一直以為自己是在「討債」，這一刻才發現：<span class="hl">這筆帳是雙向的，今生搶來的，來世要加倍還。</span><br><br>
  趙璧說：「咱們身邊俱有點銀兩，可以做個小生意，度活時日，趁此機會，改邪歸正，你們意下如何？」<br>朱九把刀拋進亂草：「大哥之言有理，我們就此收心罷。」<br><br>
  <span class="em">你在自己最餓的時候，度了十三個強盜。</span>十多年後，他們會再來找你。`,
  src:`「邱長春這些話，說得他們一十三人<span class="em">毛髮悚然</span>。」<br>趙璧又對長春曰：「老師傅好好修行，咱們弟兄，少不得後來都要拜你為師，習學妙道也。」`,
  d:{will:+10,prog:+6,big:9,small:24,mercy:2}},
 {t:"收下銀兩，找間廟住下來，招個徒弟，好好過日子。",kind:"bad",
  res:`十幾兩銀子夠你安穩幾年。幾年後你成了一間小廟的當家，香火不旺不衰，人稱一聲師父。<br><span class="em">你沒有餓死，你只是不再修了。</span>`,
  d:{heart:-15}},
 {t:"罵他們是強盜，不受賊贓。",kind:"mid",
  res:`你守住了戒，卻關上了門。<br>十三個本可回頭的人，被你一句話推了回去。<br><span class="em">戒律是拿來律己的，不是拿來斷人善根的。</span>`,
  d:{will:-15,prog:+2,big:9,small:24,mercy:-1}}
]},

ev9:{ch:3,art:"chain",title:"事件九　鐵鍊鎖樹",
scene:`魔根猶在，你仍要求死。<br><br>你化了一個多月的緣，湊了二百錢，買了一條鐵鍊、一把鐵鎖，找了個深山密林——沒有廟宇、不通路徑、人跡不到之處，把鍊子拴在大樹上，套在自己頸上鎖死，<span class="hl">再把鑰匙往空中拋去</span>，不知落在何處。<br><br>這一回，再沒有人救得了你了。<br><br>忽然來了個採藥人，問你：「老師傅身犯何罪？是誰把你鎖在樹上？」<br>你把賽麻衣的話、幾次求死遇救的事，全說了一遍。`,
ask:"化身採藥人的太白星君，究竟跟你說了什麼？",
opts:[
 {t:"「三種人算命算不準：大善人、大惡人、修道人。」",kind:"ok",
  res:`這一席話說得你如夢初醒、似暗忽明。<br>你急著要脫鎖，卻沒有鑰匙——採藥人從袖裡取出：「<span class="em">鑰匙是我拾得。</span>」<br><br>你叩謝大恩，他卻說：「我不過幾句言語勸解於你。信也由你，不信也由你。<span class="em">生死二字由你自造，於我何涉？</span>」<br>說罷飄然而去，霎時不見。`,
  src:`「<span class="em">愚哉愚哉！執迷之甚！</span>我怕你有甚麼憂天愁地之事，卻原一念入魔，自誤終身。<br><br><span class="em">相定終身，只定得尋常之人</span>；若大善之人，相也定不準；大惡之人，相也定不準。<br>相分內外，有<span class="em">心相</span>，有<span class="em">面相</span>，<span class="em">外相不及內相，命好不如心好</span>。<br>人善之人<span class="em">相隨心變</span>，心好相亦好，該死者反得長壽，逢凶化吉，遇難呈祥。<br><br><span class="em">該貧賤而轉富貴者，因他心存濟世；該富貴而反貧賤者，由其意在利己；</span><br><span class="em">該餓死而反吃用不盡者，因他愛惜米糧；該吃用有餘而反受飢餓者，因他拋撒五穀。</span><br><br>此<span class="em">心相</span>之大略也，面相何能為哉！<br>況你們修道之人，<span class="em">能斡旋造化，扭轉乾坤</span>，把一個凡體都要修成神仙，未必神仙是相上註定的麼？<br>只要你能修成神仙地位，<span class="em">那一個神仙餓得死？</span><br>若你這樣所為，生不免為餓殍，死不免為餓鬼，<span class="em">生既無用，死又何益哉！</span>」`,
  d:{will:+20,heart:+45,prog:+10,big:5,small:13,demon:-1}},
 {t:"「你命該餓死，這是天意，早死早超生。」",kind:"bad",
  res:`你聽信了，也真的死了。<br>這一段沒有下文——因為歷史上沒有第二個邱長春。`,
  d:{will:-100}},
 {t:"「我幫你打開鎖，你回去好好吃飯，別修了。」",kind:"bad",
  res:`你活了下來，卻是以放棄修行為代價。<br>命保住了，運沒有轉。`,
  d:{heart:-100}}
]},

ev10:{ch:3,art:"river",title:"事件十　蟠溪六年",
scene:`太白星君指破迷途後，你重立玄功、再下苦行。<br><br>走到一個地方，山川毓秀，一道溪河橫於路旁。正值夏日水漲，河面平坦造不成橋、架不了船，只能涉水而過。近處鄉人熟知水性不當回事，<span class="hl">遠方過客卻只能臨流嘆息</span>。<br><br>夜裡你宿在冷廟，抬頭看見匾額上寫著「<span class="hl">蟠溪</span>眾姓弟子敬獻」——<br>你猛然想起師父臨終那句「<span class="em">石番溪邊苦根盡</span>」。<br><br>苦根要盡，就盡在這裡了。`,
ask:"這六年，你決定怎麼過？",
opts:[
 {t:"背人渡水。有不能涉水的，我便背他過河；水枯時就去化齋濟眾，自己餓著。",kind:"ok",
  res:`你在河邊住了六年。<br><br>水漲的時候背人過河，來一個背一個，有人給你幾文錢買飯吃，也有人分文不取，你照樣背他過去。水枯的時候出去化齋，早化七家、晚化八家，化來的先給路上飢寒之人，自己餓一頓也不覺得怎麼樣。若遇雨隔雪阻，竟日不吃。<br><br>前前後後這幾年，<span class="hl">大餓湊足了七十二次，小餓已經數不清了</span>。<br><br>這天你在冷廟裡打坐，忽然覺得身上有什麼東西鬆了——不是餓，也不是冷，是那個從賽麻衣口中聽來、跟了你半輩子的東西。<br><br><span class="em">苦根盡處，就是了道之時。</span><br><br>六年下來，<span class="hl">意志如鐵石，道心堅固，修行圓滿</span>——<span class="em">三項俱足，功行至此已無虧欠。</span>`,
  src:`「有不能涉水者便把他背過河去……<span class="em">又有些人分文不取，也背他過去</span>。」<br>「化得齋來，<span class="em">或遇有飢寒之人便給與他吃，自己卻餓一頓</span>。若遇雨隔雪阻，<span class="em">竟日不吃</span>。」<br>「前前後後數年之間，餓得有百餘回。故如今有云：<span class="em">大餓七十二回，小餓無數</span>之言。」`,
  d:{mercy:3,setWill:100,setHeart:100,setProg:100,setBig:72,setSmall:200}},
 {t:"專心閉關打坐，不與外人接觸，把功夫坐出來。",kind:"bad",
  res:`你坐了六年，功夫確實長了。<br>但師父說的是「<span class="em">苦根盡</span>」，不是「坐功成」。<br><br>苦根要在人群裡磨——要在餓著肚子還把飯讓給別人的時候磨，要在背陌生人過河卻分文不取的時候磨。你把自己關起來，磨的只有蒲團。<br><br>六年後你出關，相沒有變，命也沒有轉。<br><span class="em">你修的是自己的清靜，不是眾生的苦。</span>`,
  d:{heart:-15}},
 {t:"到別處另尋機緣，這種苦日子撐不了六年。",kind:"bad",
  res:`你離開了蟠溪。<br>師父臨終那句話，你聽見了，卻沒有走到。<br><br><span class="em">不到苦之極處，苦根不盡，智慧難開。</span>`,
  d:{heart:-15}}
]}
};

  </div>`;
}

/* =======================================================================
   數值結算
   ======================================================================= */
const LBL={will:"意志力",heart:"修道心",prog:"修行進度"};

function applyDelta(d){
  const out=[];
  if(!d)return out;
  if(d.demon===-1) S.demon=0;
  const chgBefore=changePct();
  for(const k of ["will","heart","prog"]){
    if(d[k]===undefined)continue;
    if(k==="heart"&&S.demon&&d[k]>0)continue;
    const before=S[k];
    S[k]=clamp(S[k]+d[k],0,100);
    const real=S[k]-before;
    out.push({k,v:real!==0?real:d[k],unit:"%"});
  }
  if(d.setWill!==undefined){
    const b=S.will; S.will=d.setWill;
    if(S.will!==b) out.push({k:"will",v:S.will-b,unit:"%"});
  }
  if(d.setHeart!==undefined){
    const b=S.heart; S.heart=d.setHeart;
    if(S.heart!==b) out.push({k:"heart",v:S.heart-b,unit:"%"});
  }
  if(d.setProg!==undefined){
    const b=S.prog; S.prog=d.setProg;
    if(S.prog!==b) out.push({k:"prog",v:S.prog-b,unit:"%"});
  }
  if(d.setSmall!==undefined){
    const b=S.small; S.small=d.setSmall;
    if(S.small!==b) out.push({k:"small",v:S.small-b,unit:"次"});
  }
  if(d.big){ const b=S.big; S.big=clamp(S.big+d.big,0,BIG_HUNGER_MAX);
             if(S.big!==b) out.push({k:"big",v:S.big-b,unit:"次"}); }
  if(d.setBig!==undefined){ const b=S.big; S.big=d.setBig;
             if(S.big!==b) out.push({k:"big",v:S.big-b,unit:"次"}); }
  if(d.small){ S.small+=d.small; out.push({k:"small",v:d.small,unit:"次"}); }
  const chgAfter=changePct();
  if(chgAfter!==chgBefore) out.push({k:"change",v:chgAfter-chgBefore,unit:"%"});
  if(d.mercy) S.mercy+=d.mercy;
  if(d.demon===1){ S.demon=1; S.heart=10; }
  return out;
}

function deltaHTML(list){
  if(!list.length)return "";
  return `<div class="delta">${list.map(x=>{
    let name, cls;
    if(x.k==="big"){ name="大餓"; cls="hunger"; }
    else if(x.k==="small"){ name="小餓"; cls="hunger"; }
    else if(x.k==="change"){ name="改變進度"; cls="info"; }
    else { name=LBL[x.k]; cls=x.v>0?"up":"down"; }
    return `<span class="d ${cls}">${name} ${x.v>0?"+":""}${x.v}${x.unit}</span>`;
  }).join("")}</div>`;
}

function hungerBonus(){
  if(S.demon)return "";
  if(Math.random()<0.5){
    const before=S.heart; S.heart=clamp(S.heart+5,0,100);
    if(S.heart>before)
      return `<div class="curse good"><b>飢餓中堅定了修道心</b>　餓到極處，反而想清楚一件事：這身皮囊要不到的，正是我要修的。<br>修道心 +${S.heart-before}%</div>`;
  }
  return "";
}
function curse(){
  if(Math.random()>=CURSE_TRIGGER) return {type:"none"};
  if(Math.random()<CURSE_FATAL)    return {type:"fail"};
  const before=S.will; S.will=clamp(S.will-10,0,100);
  return {type:"drain",amount:before-S.will};
}
function curseHTML(c){
  if(c.type==="drain")
    return `<div class="curse"><b>特性一・命苦之人發作</b>　苦根重，路途不如意——即使選對了，也走得比別人辛苦。<br>意志力 −${c.amount}%</div>`;
  return "";
}
function checkFail(){
  if(S.will<20) return "意志力低於 20%，道心破裂，無法修行。";
  if(!S.demon && S.heart<=9) return "修道心已降至 10% 以下，從此對修行之路無興趣。";
  return null;
}

}

function choose(i){
  const ev=EVENTS[S.cur], o=ev.opts[i];
  let curseRes={type:"none"};
  if(o.kind==="ok") curseRes=curse();

  if(curseRes.type==="fail"){
    return screenFail(null,`
    <div class="card result">
      <div class="ch-label">${ev.title}　你的選擇</div>
      <p style="color:var(--paper2);font-size:15px">${i+1}. ${o.t}</p>
      <div class="rule"></div>
      <div class="verdict v-bad">✕　選擇正確，卻走不過去</div>
      <div class="scene">你選對了，但<span class="em">命苦之人</span>的苦根在這裡發作了。<br>
      人生路途不如意、不順遂——這一次，連做對的事都出了岔子。</div>
      <div class="curse"><b>特性一・命苦之人</b>　選擇正確，仍觸發壞情況並判定失敗。</div>
    </div>`);
  }

  const chgBefore=changePct();
  const list=applyDelta(o.d);
  let bonus="";
  if(o.d && (o.d.big || o.d.small || o.d.setBig!==undefined)) bonus=hungerBonus();

  const vcls=o.kind==="ok"?"v-ok":(o.kind==="mid"?"v-mid":"v-bad");
  const vtxt=o.kind==="ok"?"○　可以走下去":(o.kind==="mid"?"△　走得下去，但付出了代價":"✕　模擬失敗");
  const chgNow=changePct();

  const body=`
  <div class="card result">
    <div class="ch-label">${ev.title}　你的選擇</div>
    <p style="color:var(--paper2);font-size:15px">${i+1}. ${o.t}</p>
    <div class="rule"></div>
    <div class="verdict ${vcls}">${vtxt}</div>
    <div class="scene">${o.res}</div>
    ${o.src?`<div class="src"><span class="tag">七真史傳・原文</span>${o.src}</div>`:""}
    ${deltaHTML(list)}
    ${curseHTML(curseRes)}
    ${bonus}
    ${(chgNow>=100&&chgBefore<100)?`<div class="curse shine"><b>大餓已滿七十二次，改變進度 100%</b>　特性二・騰蛇鎖口——這個餓死之相，已經改過來了。</div>`:""}

  if(o.kind==="bad") return screenFail(null,body);

/* ---------- 討論頁 ---------- */
function screenTalk(){
  const t=TALKS[S.cur];
  S.ch=t.ch; S.rv=0;
  go(hud()+`
  <div class="card">
    <div class="ch-label">${t.kicker}</div>
    <h2>${t.title}</h2>

    ${t.qs.map((q,i)=>`<div class="qbox"><div class="qnum">問題 ${i+1}</div><div class="qtext">${q}</div></div>`).join("")}
    <div id="rvwrap">
      ${t.reveals.map((r,i)=>`<div class="ans reveal" id="rv${i}">${r}</div>`).join("")}

function revealNext(){
  const t=TALKS[S.cur];
  if(!t) return;
  const el=document.getElementById("rv"+S.rv);
  if(el){ el.classList.add("show"); S.rv++; }
  if(S.rv>=t.reveals.length){
    const b=document.getElementById("tapbtn");
    if(b){ b.style.display="none"; }
  }
}

/* ---------- 敘事頁 ---------- */
function screenStory(page){
  const st=STORIES[S.cur];
  S.ch=st.ch;
  const total=st.pages.length;
  let html=st.pages[page];
  if(html==="__WILLS__"){
    html=`祖師逐一囑咐門下七人——<table class="wills">`+
      st.wills.map(w=>`<tr class="${w[0]==="邱長春"?"me":""}"><td>${w[0]}</td><td>${w[1]}</td></tr>`).join("")+
      `</table><p class="small">七真之中，只有邱長春得到的是一句<span class="em">預言</span>：苦根要在蟠溪盡，大丹要在龍門成。<br>那時他還不知道蟠溪在哪裡、龍門是什麼。</p>`;
  }
  const last=page>=total-1;
  go(hud()+`
  <div class="card">
    <div class="ch-label">${st.kicker}　${page+1} / ${total}</div>
    <h2>${st.title}</h2>
    ${(page===0&&st.art)?ART[st.art]:""}
    <div class="scene">${html}</div>
  </div>
  <div class="center">
    ${page>0?`<button class="btn ghost small-btn" onclick="screenStory(${page-1})">上一頁</button>`:""}
    <button class="btn" onclick="${last?"storyDone()":"screenStory("+(page+1)+")"}">${last?"繼　續":"下一頁"}</button>
  </div>`);
}

function storyDone(){
  const st=STORIES[S.cur];
  const list=applyDelta(st.d);
  const bonus=(st.d&&st.d.small)?hungerBonus():"";
  go(hud()+`
  <div class="card result">
    <div class="ch-label">${st.title}</div>
    <div class="verdict v-ok">○　送師西歸，大事已畢</div>
    <div class="scene">師父留下的那句「石番溪邊苦根盡，龍飛門上大丹成」，你記在心裡。<br>接下來的路，要一個人走了。</div>
    ${deltaHTML(list)}
    ${bonus}
  </div>
  <div class="center"><button class="btn" onclick="next()">繼　續</button></div>`);
}

/* ---------- 流程推進 ---------- */
function chOf(id){
  return (EVENTS[id]||TALKS[id]||STORIES[id]).ch;
}
function next(){
  if(S.cur==="ev10") return screenSpecial();
  const nxt=FLOW[FLOW.indexOf(S.cur)+1];
  S.cur=nxt;
  if(chOf(nxt)!==S.ch){ S.ch=chOf(nxt); snapshot(); return screenChapter(); }
  render();
}
function screenChapter(){
  go(`<div style="height:16vh"></div>
  <div class="center">
    <div class="sub">第 ${S.ch} 章</div>
    <h1 style="font-size:clamp(26px,7vw,44px)">${CH[S.ch].name.replace(/^第.章　/,"")}</h1>
  </div>
  <div class="center" style="margin-top:26px"><button class="btn" onclick="render()">繼　續</button></div>`);
}

function specialReady(){ return S.will>=100 && S.heart>=100 && S.prog>=100; }

function screenFail(reason,body){
  const chName=CH[S.ch].name;

臣恐天下後世修行悟道之人，不能如臣受苦受難，<span class="em">有學道之名，而無學道之實也</span>，使臣無從化度，有負吾皇榮封之恩，<span class="em">故臣不敢謝恩也</span>！伏乞赦罪。」
</div>
<div class="scene" style="text-align:center"><span class="em">群　仙　默　然。</span></div>
<div class="scene">
這時西大廳走出一位星君——赤髮赤面赤鬚赤心，金盔金甲金磚金鞭，人稱鐵面雷公、<span class="hl">先天靈祖</span>。<br>
他聞聽此奏起了惻隱之心，願作護法之神，大聲喊道：
</div>
<div class="src"><span class="tag">先天靈祖</span>
「<span class="em">邱長春，你只管謝恩！<br>後世若有修行之人、學道之士，他有三分修持，我有七分感應；<br>他有十分修持，我便隨時照臨，自有人辦齋造供，不使他忍飢受寒！</span>」
</div>
<div class="scene">
你聽了才肯謝恩，又與星君作禮——<br>
<span class="em">把一個幾千斤重的擔子，與星君擱在了肩頭上。</span><br><br>
<span class="hl">大仙都已經成道了，還心繫著沒有得渡的眾生。</span>
</div>`}
];

function ending(i){
  if(i>=ENDINGS.length) return screenVow();
  const e=ENDINGS[i];
  go(`
  ${i===0?'<div class="ending-title">圓 滿 成 仙</div>':''}
  <div class="card">
    <div class="ed-step">${e.step}</div>
    <h2 style="text-align:center">${e.title}</h2>
    <div class="rule"></div>
    ${e.html}
  </div>
  <div class="center">
    <button class="btn" onclick="ending(${i+1})">${i===ENDINGS.length-1?'回　向':'繼　續'}</button>
  </div>`);
}

function screenVow(){
  go(`
  <div class="ending-title">回　向</div>
  <div class="card">
    <div class="vow">
      邱長春大仙慈悲：<br><br>
      <span class="em">「智者只知道改變方法，不改目標；<br>愚者常改變目標，而不改方法。」</span>
    </div>
  </div>
  <div class="card">
    <div class="vow">
      邱長春大仙慈悲：<br><br>
      <span class="em">「修道人要存大仁，去接受所不能改變的一切；<br>
      存大勇，去改變所能改變的一切；<br>
      存大智，去分辨兩者之間的差別；<br>
      並且存大愿，使人人都有此自覺。」</span>
    </div>
  </div>
  <div class="card center">
    <h2 style="text-align:center">命也，不可改　運也，可以轉</h2>
    <p>問賢士們——你是相信<span class="em">命運</span>，還是相信<span class="em">運命</span>？</p>
    <div class="rule"></div>
    <p class="small">本局紀錄：意志力 ${S.will}%　修道心 ${S.heart}%　修行進度 ${S.prog}%<br>
    大餓 ${S.big} 次　小餓 ${S.small} 次　改變進度 ${changePct()}%</p>
  </div>
  <div class="center"><button class="btn" onclick="screenEpilogue()">結　語</button></div>`);
}

/* ---------- 結語 ---------- */
const EPILOGUE=[
 "莫言自己無才無能，輕視自我不如上方講師；",
 "莫說自己無錢無知，藐視自我不如富貴能人。",
 "",
 "若說自己情況糟糕，不適合修道，且看邱長春大仙——",
 "歷經大餓小餓相加無數次，依然能成聖成仙。",
 "",
 "試問我等情況可有比邱大仙差？",
 "若能修道除去二心，堅定初心，未來必然，成佛有餘。"
];

function screenEpilogue(){
  go(`
  <div class="ending-title">結　語</div>
  ${ART.cover}
  <div class="card">
    <div class="vow" style="font-size:18px;line-height:2.6">
      ${EPILOGUE.map(l=>l?`<span class="em">${l}</span><br>`:"<br>").join("")}
    </div>
    <div class="rule"></div>
    <div class="center" style="font-size:22px;letter-spacing:.5em;text-indent:.5em;color:var(--gold)">共勉之</div>
  </div>
  <div class="center">
    <button class="btn" onclick="screenTitle()">再　來　一　次</button><br>
    <button class="btn ghost small-btn" onclick="downloadPPT()">下載成 PPT 講義</button>
  </div>`);
}

const CRC_TABLE=(function(){
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_TABLE[(c ^ buf[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], central=[];
  let offset=0;
  const u16=v=>[v&0xFF,(v>>8)&0xFF];
  const u32=v=>[v&0xFF,(v>>8)&0xFF,(v>>16)&0xFF,(v>>>24)&0xFF];
  for(const name in files){
    const v=files[name];
    const nameB=enc.encode(name);
    const data=(v instanceof Uint8Array)?v:enc.encode(v);   // 二進位（PNG）或文字（XML）
    const crc=crc32(data);
    const local=[].concat([0x50,0x4B,0x03,0x04],u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(crc),u32(data.length),u32(data.length),u16(nameB.length),u16(0));
    parts.push(new Uint8Array(local), nameB, data);
    central.push({name:nameB,crc,size:data.length,offset});
    offset += local.length + nameB.length + data.length;
  }
  const cdir=[];
  for(const e of central){
    const h=[].concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0),
      u32(e.crc),u32(e.size),u32(e.size),u16(e.name.length),u16(0),u16(0),u16(0),u16(0),
      u32(0),u32(e.offset));
    cdir.push(new Uint8Array(h), e.name);
  }
  const cdirSize=cdir.reduce((s,a)=>s+a.length,0);
  const end=new Uint8Array([].concat([0x50,0x4B,0x05,0x06],u16(0),u16(0),
    u16(central.length),u16(central.length),u32(cdirSize),u32(offset),u16(0)));
  const all=parts.concat(cdir,[end]);
  const total=all.reduce((s,a)=>s+a.length,0);
  const out=new Uint8Array(total); let p=0;
  for(const a of all){ out.set(a,p); p+=a.length; }
  return out;
}

    .replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"');
  return s.split("\n").map(x=>x.trim()).filter((x,i,a)=>!(x===""&&a[i-1]===""));
}
function pptPara(text,sz,color,bold,algn){
  const rpr=`<a:rPr lang="zh-TW" altLang="en-US" sz="${sz}" b="${bold?1:0}" dirty="0">`+
    `<a:solidFill><a:srgbClr val="${color}"/></a:solidFill>`+
    `<a:latin typeface="${PFONT}"/><a:ea typeface="${PFONT}"/></a:rPr>`;
  const body = text ? `<a:r>${rpr}<a:t>${xesc(text)}</a:t></a:r>`
    : `<a:endParaRPr lang="zh-TW" sz="${sz}"><a:latin typeface="${PFONT}"/><a:ea typeface="${PFONT}"/></a:endParaRPr>`;
  return `<a:p><a:pPr algn="${algn||'l'}"><a:lnSpc><a:spcPct val="125000"/></a:lnSpc></a:pPr>${body}</a:p>`;
}
function pptBox(id,x,y,cx,cy,paras,anchor){
  return `<p:sp><p:nvSpPr><p:cNvPr id="${id}" name="tb${id}"/>`+
    `<p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr>`+
    `<p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`+
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/></p:spPr>`+
    `<p:txBody><a:bodyPr wrap="square" anchor="${anchor||'t'}"><a:normAutofit/></a:bodyPr>`+
    `<a:lstStyle/>${paras.join("")}</p:txBody></p:sp>`;
}
function pptSlide(shapes){
  return XH+'<p:sld xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '+
    'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main"><p:cSld>'+
    '<p:bg><p:bgPr><a:solidFill><a:srgbClr val="14110E"/></a:solidFill><a:effectLst/></p:bgPr></p:bg>'+
    '<p:spTree><p:nvGrpSpPr><p:cNvPr id="1" name=""/><p:cNvGrpSpPr/><p:nvPr/></p:nvGrpSpPr>'+
    '<p:grpSpPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/>'+
    '<a:chOff x="0" y="0"/><a:chExt cx="0" cy="0"/></a:xfrm></p:grpSpPr>'+
    shapes.join("")+
    '</p:spTree></p:cSld><p:clrMapOvr><a:masterClrMapping/></p:clrMapOvr></p:sld>';
}
/* ---- SVG → PNG（canvas），供 pptx 內嵌 ---- */
const SVG_CSS='<style type="text/css"><![CDATA['+
 '.ink{fill:none;stroke:#ece3d2;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}'+
 '.gold{fill:none;stroke:#c9a227;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}'+
 '.far{fill:none;stroke:#c9a227;stroke-width:1.4;opacity:.42;stroke-linecap:round}'+
 '.red{fill:none;stroke:#a83232;stroke-width:2.2;stroke-linecap:round}'+
 '.fillp{fill:#ece3d2;stroke:none}.fillg{fill:#c9a227;stroke:none}.fillr{fill:#a83232;stroke:none}'+
 'text{font-family:"Microsoft JhengHei","MingLiU",serif}'+
 ']]></style>';

function svgStandalone(svg){
  // 加上 xmlns / 尺寸 / 內嵌樣式 / 底色，讓它能單獨當成圖片渲染
  let s=svg.replace('<svg class="art" viewBox="0 0 800 180"',
    '<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="360" viewBox="0 0 800 180"');
  const i=s.indexOf(">")+1;
  return s.slice(0,i)+SVG_CSS+
    '<rect width="800" height="180" fill="#14110E"/>'+
    '<rect x="1" y="1" width="798" height="178" fill="none" stroke="#c9a227" stroke-opacity=".35" stroke-width="1.5"/>'+
    s.slice(i);
}

function svgToPng(svg,w,h){
  return new Promise((resolve,reject)=>{
    const blob=new Blob([svgStandalone(svg)],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const img=new Image();
    img.onload=function(){
      try{
        const c=document.createElement("canvas");
        c.width=w; c.height=h;
        const ctx=c.getContext("2d");
        ctx.fillStyle="#14110E"; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        const b64=c.toDataURL("image/png").split(",")[1];
        const bin=atob(b64), arr=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
        resolve(arr);
      }catch(e){ URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error("SVG 無法轉為圖片")); };
    img.src=url;
  });
}

/* 圖片形狀（rId2 固定為該張投影片的圖） */
function pptPic(id,x,y,cx,cy){
  return `<p:pic><p:nvPicPr><p:cNvPr id="${id}" name="art${id}"/>`+
    `<p:cNvPicPr><a:picLocks noChangeAspect="1"/></p:cNvPicPr><p:nvPr/></p:nvPicPr>`+
    `<p:blipFill><a:blip r:embed="rId2"/><a:stretch><a:fillRect/></a:stretch></p:blipFill>`+
    `<p:spPr><a:xfrm><a:off x="${x}" y="${y}"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`+
    `<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></p:spPr></p:pic>`;
}

const LINES_PER_SLIDE=13;
const LINES_WITH_ART=8;
/* 回傳 [{xml, art}]；art 為圖名（只有該事件的第一張投影片帶圖） */
function slidePage(kicker,title,lines,opt){
  opt=opt||{};
  const out=[], chunks=[];
  const per=opt.art?LINES_WITH_ART:LINES_PER_SLIDE;
  for(let i=0;i<lines.length;i+=per) chunks.push(lines.slice(i,i+per));
  if(!chunks.length) chunks.push([]);
  chunks.forEach((chunk,ci)=>{
    const sh=[], withArt=(ci===0&&opt.art);
    if(kicker) sh.push(pptBox(2,700000,400000,10800000,460000,
      [pptPara(kicker,1300,"C9A227",false,opt.algn)]));
    sh.push(pptBox(3,700000,830000,10800000,1100000,
      [pptPara(title+(ci?"（續）":""),opt.big?4000:2800,"E8C65A",true,opt.algn)]));
    if(withArt){
      // 圖：寬 7,200,000 EMU（800:180 → 高 1,620,000），置中
      sh.push(pptPic(9,2496000,1980000,7200000,1620000));
      sh.push(pptBox(4,700000,3760000,10800000,2760000,
        chunk.map(t=>pptPara(t,opt.sz||1500,t.charAt(0)==="「"?"D8CCB4":"ECE3D2",false,opt.algn)),
        opt.anchor));
    }else{
      sh.push(pptBox(4,700000,2100000,10800000,4300000,
        chunk.map(t=>pptPara(t,opt.sz||1700,t.charAt(0)==="「"?"D8CCB4":"ECE3D2",false,opt.algn)),
        opt.anchor));
    }
    out.push({xml:pptSlide(sh), art:withArt?opt.art:null});
  });
  return out;
}

async function downloadPPT(){
  try{
    if(!PPTX_SKELETON || !PPTX_SKELETON["ppt/theme/theme1.xml"]){
      toast("PPT 骨架未載入，無法匯出"); return;
    }
    toast("正在產生 PPT…",8000);
    const slides=buildSlides(), n=slides.length;
    const files={};
    for(const k in PPTX_SKELETON) files[k]=PPTX_SKELETON[k];

    // --- 插圖：SVG → PNG → ppt/media ---
    const used=[], media={};
    slides.forEach(s=>{ if(s.art && used.indexOf(s.art)<0) used.push(s.art); });
    let imgOK=0;
    for(let k=0;k<used.length;k++){
      toast("正在轉換插圖　"+(k+1)+" / "+used.length,9000);
      await new Promise(r=>setTimeout(r,0));   // 讓 toast 有機會重繪
      try{
        const png=await svgToPng(ART[used[k]],1600,360);
        imgOK++;
        media[used[k]]=imgOK;
        files["ppt/media/image"+imgOK+".png"]=png;
      }catch(e){ console.warn("插圖轉檔失敗：",used[k],e); }
    }

    let ct=XH+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      (imgOK?'<Default Extension="png" ContentType="image/png"/>':'')+
      '<Override PartName="/ppt/presentation.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.presentation.main+xml"/>'+
      '<Override PartName="/ppt/slideMasters/slideMaster1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideMaster+xml"/>'+
      '<Override PartName="/ppt/slideLayouts/slideLayout1.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slideLayout+xml"/>'+
      '<Override PartName="/ppt/theme/theme1.xml" ContentType="application/vnd.openxmlformats-officedocument.theme+xml"/>';
    let sldIds="", presRels=`<Relationship Id="rId1" Type="${RT}/slideMaster" Target="slideMasters/slideMaster1.xml"/>`;
    for(let i=1;i<=n;i++){
      const sl=slides[i-1];
      const hasImg=sl.art && media[sl.art];
      // 沒轉成圖的話，把圖形狀從 XML 拿掉，避免產生壞掉的引用
      files["ppt/slides/slide"+i+".xml"]=hasImg?sl.xml:sl.xml.replace(/<p:pic>[\s\S]*?<\/p:pic>/,"");
      let rels=`<Relationship Id="rId1" Type="${RT}/slideLayout" Target="../slideLayouts/slideLayout1.xml"/>`;
      if(hasImg) rels+=`<Relationship Id="rId2" Type="${RT}/image" Target="../media/image${media[sl.art]}.png"/>`;
      files["ppt/slides/_rels/slide"+i+".xml.rels"]=XH+`<Relationships ${RNS}>${rels}</Relationships>`;
      ct+=`<Override PartName="/ppt/slides/slide${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.presentationml.slide+xml"/>`;
      sldIds+=`<p:sldId id="${255+i}" r:id="rId${i+1}"/>`;
      presRels+=`<Relationship Id="rId${i+1}" Type="${RT}/slide" Target="slides/slide${i}.xml"/>`;
    }
    ct+="</Types>";
    presRels+=`<Relationship Id="rId${n+2}" Type="${RT}/theme" Target="theme/theme1.xml"/>`;

    files["[Content_Types].xml"]=ct;
    files["ppt/presentation.xml"]=XH+
      '<p:presentation xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" '+
      'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" saveSubsetFonts="1">'+
      '<p:sldMasterIdLst><p:sldMasterId id="2147483648" r:id="rId1"/></p:sldMasterIdLst>'+
      `<p:sldIdLst>${sldIds}</p:sldIdLst>`+
      '<p:sldSz cx="12192000" cy="6858000"/><p:notesSz cx="6858000" cy="9144000"/></p:presentation>';
    files["ppt/_rels/presentation.xml.rels"]=XH+`<Relationships ${RNS}>${presRels}</Relationships>`;

    const bytes=zipStore(files);
    const blob=new Blob([bytes],{type:"application/vnd.openxmlformats-officedocument.presentationml.presentation"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="邱大仙行誼_運命.pptx";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast("已產生 "+n+" 張投影片（含 "+imgOK+" 張插圖），開始下載",4000);
  }catch(err){
    toast("匯出失敗："+err.message,5000);
    console.error(err);
  }
}
